<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://rawgit.com/Microsoft/PowerBI-JavaScript/master/dist/powerbi.min.js"></script>
    
    <title>Report</title>
</head>
<body>
    <div id="reportContainer" style="width: 100%; height: 100vh;"></div>
</body>

<script type="text/javascript">
    $(document).ready(function() {
        (async () => {
            const accessToken = localStorage.getItem("ControladoriaAccessToken")
            const token = localStorage.getItem("ControladoriaToken")

            const url = `https://backend-app-cd40-prod.herokuapp.com/report_api?token_api=${token}` 

            if(accessToken && url && token) {
                const response = await fetch(url, {
                    method: "GET",
                    headers: {
                        Authorization: `Bearer ${accessToken}`
                    }
                })
                .then((res) => res.json())
                .then((response) => {
                    if(response.error) {
                        alert(response.error)
                    } else {
                        return response
                    }
                })

                const models = window["powerbi-client"].models

                const embedConfig = {
                    type: "report",
                    id: response.reportId,
                    accessToken: response.embedToken,
                    embedUrl: response.embedUrl,
                    tokenType: models.TokenType.Embed
                }

                const reportContainer = document.getElementById("reportContainer")
                const report = powerbi.embed(reportContainer, embedConfig)
            }   


        })()
    })
</script>
</html>
